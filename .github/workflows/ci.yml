name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Muss zu "engines.node" in package.json passen.
          node-version: "22"
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen (ohne Push – prüft nur, dass das Dockerfile durchläuft)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smartcart:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
